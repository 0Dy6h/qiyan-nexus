[project]
name = "qiyan-nexus-backend"
version = "0.1.0"
description = "FastAPI backend for Qiyan Nexus"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
