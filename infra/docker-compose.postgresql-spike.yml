services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: qiyan-postgres-spike
    environment:
      POSTGRES_DB: ${QIYAN_POSTGRES_DB:-qiyan_nexus}
      POSTGRES_USER: ${QIYAN_POSTGRES_USER:-qiyan_dev}
      POSTGRES_PASSWORD: ${QIYAN_POSTGRES_PASSWORD:-qiyan_dev_pass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${QIYAN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/app/repositories/postgres_schema.sql:/docker-entrypoint-initdb.d/01_qiyan_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: qiyan_postgres_spike_data
