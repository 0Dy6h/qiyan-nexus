version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qiyan-postgres-dev
    environment:
      POSTGRES_DB: qiyan_dev
      POSTGRES_USER: qiyan
      POSTGRES_PASSWORD: qiyan_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiyan -d qiyan_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: qiyan_postgres_dev_data
